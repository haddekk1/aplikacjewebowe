<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0" />
    <title>Ćwiczenie 2 - tabela produktów</title>
    <style>
      table {
        border-collapse: collapse; 
        width: 100%;
        max-width: 700px;
      }
      
      table, th, td {
        border: 2px solid black; 
      }
      
      th, td {
        padding: 10px;
        text-align: left;
      }
      
      th {
        background-color: #e6e08c;
      }
    </style>
  </head>
  <body>
    <main style="padding: 10px;">
      <h1>Losowe banknoty pamiątkowe</h1>
      
      <table>
        <thead>
          <tr>
            <th>Nr</th>
            <th>Nazwa produktu</th>
            <th>Cena produktu</th>
            <th>Liczba sztuk</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Banknot 50,00 zł</td>
            <td>55,00 zł</td>
            <td>10</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Banknot 100,00 zł</td>
            <td>105,00 zł</td>
            <td>50</td>
          </tr>
          <tr>
            <td>3</td>
            <td>Banknot 200,00 zł</td>
            <td>210,00 zł</td>
            <td>14</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Banknot 500,00 zł</td>
            <td>515,00 zł</td>
            <td>18</td>
          </tr>
          <tr>
            <td>5</td>
            <td>Banknot 20,00 zł</td>
            <td>25,00 zł</td>
            <td>3</td>
          </tr>
        </tbody>
      </table>
      
      <br>
      <a href="./index.html">Wróć do strony głównej</a>
    </main>
  </body>
</html>
